services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: lab8
      POSTGRES_USER: lab8
      POSTGRES_PASSWORD: "123"
    ports:
      - "127.0.0.1:15432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/001_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lab8 -d lab8"]
      interval: 3s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
